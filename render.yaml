services:
  - type: web
    name: jobos-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      # Set this manually in the Render dashboard to your Neon connection
      # string (see DEPLOY.md) — not a Render-managed database, so it can't
      # be wired via fromDatabase.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://jobos-frontend-5de2.onrender.com
      - key: SECRET_KEY
        generateValue: true
      # Groq parses candidate emails into structured interview details —
      # see DEPLOY.md for where to get a free key.
      - key: GROQ_API_KEY
        sync: false
      # Google OAuth for the Gmail integration — see DEPLOY.md for creating
      # these in Google Cloud Console. Redirect URI and frontend URL are
      # already known (both services' real URLs), so those are set directly.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://jobos-backend.onrender.com/api/gmail/callback
      - key: FRONTEND_URL
        value: https://jobos-frontend-5de2.onrender.com
      # GEMINI_API_KEY, AWS_* aren't read by any code yet — add them in the
      # dashboard's Environment tab later if you wire up those features.
      # Declaring them here as sync:false would block blueprint deploys
      # until every one has a value.

  - type: web
    name: jobos-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Left empty on purpose — the frontend calls relative /api/... paths,
      # proxied to the backend by the rewrite rule below. That keeps the
      # browser's view of everything same-origin, so the session cookie is
      # first-party instead of cross-site (which Safari, and increasingly
      # Chrome, block outright regardless of SameSite=None).
      - key: VITE_API_BASE
        value: ""
    routes:
      # Must come before the SPA-fallback rule below — first match wins,
      # and the catch-all would otherwise swallow /api/* requests and
      # serve index.html instead of proxying them to the backend.
      # :splat captures the whole matched path including the literal "api"
      # segment (verified empirically against the deployed rule — a
      # destination of .../api/:splat double-prefixed every request to
      # .../api/api/...), so the destination doesn't repeat /api itself.
      - type: rewrite
        source: /api/*
        destination: https://jobos-backend.onrender.com/:splat
      - type: rewrite
        source: /*
        destination: /index.html
